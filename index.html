<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2027 歐洲旅遊17大精選行程</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #0284c7;
      --price: #dc2626;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --ci-bg: #fce7f3;
      --ci-text: #9d174d;
      --jx-bg: #fef3c7;
      --jx-text: #92400e;
      --br-bg: #dcfce7;
      --br-text: #166534;
      --cx-bg: #ccfbf1;
      --cx-text: #115e59;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }
    .app-container {
      max-width: 600px;
      margin: 0 auto;
    }
    /* 頂部標題區 */
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      color: #fff;
      padding: 18px 16px 14px;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }
    header h1 { font-size: 1.18rem; font-weight: 800; margin-bottom: 4px; }
    header p { font-size: 0.78rem; color: #cbd5e1; }

    /* 置頂控制面板 */
    .sticky-controls {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(241, 245, 249, 0.96);
      backdrop-filter: blur(8px);
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--border);
    }
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr 1.18fr;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 10px;
      margin-bottom: 8px;
      gap: 2px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      padding: 7px 4px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: var(--card);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .search-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .search-input {
      flex: 1;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.84rem;
      background: var(--card);
    }
    .region-select {
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--card);
      color: var(--primary);
    }
    /* 橫向滑動快速標籤 */
    .chip-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 2團並排選擇器面板 */
    .compare-selector-box {
      background: var(--card);
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 4px;
      max-height: 165px;
      overflow-y: auto;
    }
    .selector-hint {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--card);
      padding-bottom: 4px;
    }
    .selector-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: 0.15s;
    }
    .check-pill.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 800;
    }
    .check-pill .dot {
      width: 13px;
      height: 13px;
      border-radius: 4px;
      border: 1.5px solid #94a3b8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      background: #fff;
    }
    .check-pill.selected .dot {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* 內容區 */
    .content-area { padding: 12px; }

    /* 卡片樣式 */
    .tour-card {
      background: var(--card);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1.5px solid var(--border);
      transition: 0.2s;
    }
    .tour-card.checked-card {
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(30, 58, 138, 0.12);
    }
    .card-header {
      border-bottom: 1px dashed var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge-group {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge-ci { background: var(--ci-bg); color: var(--ci-text); }
    .badge-jx { background: var(--jx-bg); color: var(--jx-text); }
    .badge-br { background: var(--br-bg); color: var(--br-text); }
    .badge-cx { background: var(--cx-bg); color: var(--cx-text); }
    .badge-region { background: #e0e7ff; color: #3730a3; }

    .compare-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      border: 1.5px solid var(--primary);
      background: #fff;
      color: var(--primary);
      cursor: pointer;
    }
    .compare-toggle-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .tour-title { font-size: 1.02rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .tour-code { font-size: 0.75rem; color: var(--muted); font-family: monospace; margin-bottom: 6px; }
    .price-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .price-main { font-size: 1.15rem; font-weight: 800; color: var(--price); }
    .price-orig { font-size: 0.75rem; color: var(--muted); }

    /* 卡片內部維度區塊 */
    .info-block {
      background: #f8fafc;
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 8px;
      border-left: 3.5px solid var(--accent);
    }
    .info-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .info-block ul { padding-left: 16px; font-size: 0.84rem; }
    .info-block li { margin-bottom: 3px; }

    .btn-link {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 9px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      margin-top: 10px;
    }

    /* 依項目PK模式樣式 */
    .pk-section {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .pk-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary);
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--primary-light);
    }
    .pk-item {
      padding: 9px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .pk-item:last-child { border-bottom: none; padding-bottom: 0; }
    .pk-tour-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .pk-content { font-size: 0.83rem; color: var(--text); padding-left: 16px; }

    /* 雙團並排對比 (Side-by-Side 2-Column) */
    .sbs-header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      position: sticky;
      top: 165px;
      z-index: 90;
    }
    .sbs-top-card {
      background: var(--primary);
      color: #fff;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(30, 58, 138, 0.2);
    }
    .sbs-top-card .sbs-name {
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .sbs-top-card .sbs-price {
      font-size: 0.92rem;
      font-weight: 800;
      color: #fde047;
    }
    .sbs-top-card .sbs-code {
      font-size: 0.66rem;
      color: #cbd5e1;
      font-family: monospace;
    }
    .sbs-row-card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .sbs-row-title {
      background: #e2e8f0;
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 800;
      padding: 6px 12px;
      text-align: center;
    }
    .sbs-two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .sbs-col {
      padding: 10px;
      font-size: 0.79rem;
      border-right: 1px solid var(--border);
    }
    .sbs-col:last-child { border-right: none; }
    .sbs-col ul { padding-left: 14px; }
    .sbs-col li { margin-bottom: 4px; }

    /* 底部浮動對比提示列 */
    .floating-compare-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 560px;
      background: #0f172a;
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      z-index: 200;
    }
    .floating-info {
      font-size: 0.78rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 8px;
    }
    .floating-info span { color: #38bdf8; font-weight: 800; }
    .floating-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-go-compare {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-go-compare:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .btn-clear {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* 資料來源區 */
    .source-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      margin: 12px;
      border: 1px solid var(--border);
    }
    .source-card h3 { font-size: 0.9rem; color: var(--primary); margin-bottom: 8px; }
    .source-card ol { padding-left: 18px; font-size: 0.74rem; color: var(--muted); }
    .source-card li { margin-bottom: 6px; word-break: break-all; }
    .source-card a { color: var(--accent); text-decoration: none; }

    .highlight { background-color: #fef08a !important; border-radius: 4px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>2027 歐洲 17 大精選行程比較</h1>
    <p>涵蓋喜鴻、巨匠、可樂、加利利、雄獅｜支援勾選 2 團並排對決</p>
  </header>

  <div class="sticky-controls">
    <div class="mode-switch">
      <button class="mode-btn active" id="btnModeTour" onclick="switchMode('tour')">依行程看 (17團)</button>
      <button class="mode-btn" id="btnModePK" onclick="switchMode('pk')">依項目比 (全部)</button>
      <button class="mode-btn" id="btnModeDual" onclick="switchMode('dual')">⚖️ 雙團並排 (<span id="dualCountBadge">2</span>/2)</button>
    </div>

    <div class="search-row">
      <select class="region-select" id="regionFilter" onchange="applyFilters()">
        <option value="all">🌍 全部路線 (17)</option>
        <option value="奧捷/德捷/德奧捷/奧捷匈">🏰 奧捷/德/匈 (10)</option>
        <option value="克斯/克斯奧/克斯蒙/匈克斯">🌊 克斯/奧/蒙/匈 (7)</option>
      </select>
      <input type="text" class="search-input" id="searchInput" placeholder="搜尋關鍵字 (如: 新天鵝堡、杜布羅尼克、星宇)..." oninput="runSearch()">
    </div>

    <!-- 依行程模式的快速跳轉列 -->
    <div class="chip-scroll" id="tourChips"></div>

    <!-- 依項目PK模式的分類篩選列 -->
    <div class="chip-scroll hidden" id="pkChips">
      <button class="chip active" onclick="filterPK('all', this)">全部維度</button>
      <button class="chip" onclick="filterPK('flight', this)">✈️ 航班與日期</button>
      <button class="chip" onclick="filterPK('price', this)">💰 團費與定位</button>
      <button class="chip" onclick="filterPK('itinerary', this)">🗺️ 行程路線</button>
      <button class="chip" onclick="filterPK('hotel', this)">🏨 飯店住宿</button>
      <button class="chip" onclick="filterPK('food', this)">🍽️ 特色餐飲</button>
    </div>

    <!-- 雙團並排模式的勾選開關面板 -->
    <div class="compare-selector-box hidden" id="dualSelectorBox">
      <div class="selector-hint">
        <span>點選任意 2 個行程進行左右並排 PK：</span>
        <span id="selectorStatusText">已選 2 / 2 團</span>
      </div>
      <div class="selector-grid" id="pillContainer"></div>
    </div>
  </div>

  <!-- 模式一：依行程看 (垂直卡片) -->
  <div class="content-area" id="viewTour"></div>

  <!-- 模式二：依項目比 (17團維度PK) -->
  <div class="content-area hidden" id="viewPK"></div>

  <!-- 模式三：勾選 2 團並排對比 (Side-by-Side) -->
  <div class="content-area hidden" id="viewDual"></div>

  <div class="source-card">
    <h3>網頁資料來源註記 (17大行程官方連結)</h3>
    <ol id="sourceList"></ol>
  </div>
</div>

<!-- 底部浮動並排比較狀態列 -->
<div class="floating-compare-bar" id="floatingBar">
  <div class="floating-info" id="floatingText">
    已勾選 <span>2 / 2</span> 個行程
  </div>
  <div class="floating-actions">
    <button class="btn-clear" onclick="clearCompareSelection()">重選</button>
    <button class="btn-go-compare" id="btnGoDual" onclick="switchMode('dual')">並排對決 ➔</button>
  </div>
</div>

  // 預設勾選第 14 團 (雄獅星宇奧捷) 與 第 16 團 (雄獅經典德捷) 方便直接預覽雙團 PK
  let selectedIds = ['t14', 't16'];

  function initChipsAndSources() {
    const chipContainer = document.getElementById('tourChips');
    chipContainer.innerHTML = `<button class="chip active" onclick="filterTour('all', this)">全部顯示 (17)</button>` +
      tours.map(t => `<button class="chip" data-chip-region="${t.region}" onclick="filterTour('${t.id}', this)">${t.pillLabel}</button>`).join('');

    const sourceList = document.getElementById('sourceList');
    sourceList.innerHTML = tours.map(t => `
      <li>${t.title} (${t.code})：<a href="${t.url}" target="_blank">${t.url}</a></li>
    `).join('');
  }

  function toggleSelectTour(id) {
    const idx = selectedIds.indexOf(id);
    if (idx > -1) {
      selectedIds.splice(idx, 1);
    } else {
      if (selectedIds.length >= 2) {
        selectedIds.shift();
      }
      selectedIds.push(id);
    }
    updateSelectionUI();
  }

  function clearCompareSelection() {
    selectedIds = [];
    updateSelectionUI();
  }

  function updateSelectionUI() {
    document.getElementById('dualCountBadge').innerText = selectedIds.length;
    document.getElementById('selectorStatusText').innerText = `已選 ${selectedIds.length} / 2 團`;

    const pillContainer = document.getElementById('pillContainer');
    pillContainer.innerHTML = tours.map(t => {
      const isSel = selectedIds.includes(t.id);
      return `
        <div class="check-pill ${isSel ? 'selected' : ''}" onclick="toggleSelectTour('${t.id}')">
          <span class="dot">${isSel ? '✓' : ''}</span>
          <span>${t.pillLabel}</span>
        </div>
      `;
    }).join('');

    tours.forEach(t => {
      const isSel = selectedIds.includes(t.id);
      const cardEl = document.querySelector(`.tour-card[data-tour="${t.id}"]`);
      const btnEl = document.getElementById(`cardBtn_${t.id}`);
      if (cardEl) cardEl.classList.toggle('checked-card', isSel);
      if (btnEl) {
        btnEl.classList.toggle('active', isSel);
        btnEl.innerHTML = isSel ? '✓ 已加入並排' : '+ 勾選PK';
      }
    });

    const floatingText = document.getElementById('floatingText');
    const btnGoDual = document.getElementById('btnGoDual');
    if (selectedIds.length === 2) {
      const names = selectedIds.map(id => tours.find(x => x.id === id).pillLabel).join(' vs ');
      floatingText.innerHTML = `對決：<span>${names}</span>`;
      btnGoDual.disabled = false;
    } else {
      floatingText.innerHTML = `已勾選 <span>${selectedIds.length} / 2</span> 團 (請選滿2團)`;
      btnGoDual.disabled = true;
    }

    renderDualView();
    runSearch();
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('btnModeTour').classList.toggle('active', mode === 'tour');
    document.getElementById('btnModePK').classList.toggle('active', mode === 'pk');
    document.getElementById('btnModeDual').classList.toggle('active', mode === 'dual');

    document.getElementById('viewTour').classList.toggle('hidden', mode !== 'tour');
    document.getElementById('viewPK').classList.toggle('hidden', mode !== 'pk');
    document.getElementById('viewDual').classList.toggle('hidden', mode !== 'dual');

    document.getElementById('tourChips').classList.toggle('hidden', mode !== 'tour');
    document.getElementById('pkChips').classList.toggle('hidden', mode !== 'pk');
    document.getElementById('dualSelectorBox').classList.toggle('hidden', mode !== 'dual');

    document.getElementById('floatingBar').classList.toggle('hidden', mode === 'dual');

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function filterTour(id, btn) {
    activeTourFilter = id;
    document.querySelectorAll('#tourChips .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const regionVal = document.getElementById('regionFilter').value;

    // 篩選卡片
    document.querySelectorAll('.tour-card').forEach(card => {
      const matchTour = (activeTourFilter === 'all' || card.dataset.tour === activeTourFilter);
      const matchRegion = (regionVal === 'all' || card.dataset.region === regionVal);
      card.style.display = (matchTour && matchRegion) ? '' : 'none';
    });

    // 篩選 PK 列表項目
    document.querySelectorAll('.pk-item').forEach(item => {
      const matchRegion = (regionVal === 'all' || item.dataset.region === regionVal);
      item.style.display = matchRegion ? '' : 'none';
    });
  }

  function filterPK(key, btn) {
    document.querySelectorAll('#pkChips .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.pk-section').forEach(sec => {
      sec.style.display = (key === 'all' || sec.dataset.pk === key) ? '' : 'none';
    });
  }

  function runSearch() {
    const kw = document.getElementById('searchInput').value.trim().toLowerCase();
    document.querySelectorAll('[data-searchable]').forEach(el => {
      if (!kw) {
        el.classList.remove('highlight');
        return;
      }
      if (el.innerText.toLowerCase().includes(kw)) {
        el.classList.add('highlight');
      } else {
        el.classList.remove('highlight');
      }
    });
  }

  initChipsAndSources();
  renderTourCards();
  renderPKView();
  updateSelectionUI();
</script>

</body>
</html>
